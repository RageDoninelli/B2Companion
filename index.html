<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <meta name="description" content="V.I.V.A. Academy English B2 Companion: gramática, práctica y acceso a clase.">
  <title>V.I.V.A. English B2 Companion</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root{--navy:#152744;--navy2:#203b62;--teal:#1a927c;--teal-light:#e3f5ef;--yellow:#f9cb62;--white:#fff;--bg:#f3f6fa;--line:#dce4ee;--muted:#607087;--bad:#aa3344;--bad-light:#fff0f2;--ok:#087852;--shadow:0 10px 30px rgba(18,38,71,.07)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--navy);line-height:1.5;padding-bottom:calc(90px + env(safe-area-inset-bottom));}
    button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.58}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f0b62c;outline-offset:3px}
    .wrap{width:min(960px,100%);margin:auto;padding:20px 20px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:9px;text-decoration:none}.mark{width:43px;height:43px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:900;letter-spacing:-.8px;box-shadow:0 5px 12px rgba(20,39,68,.12)}.brandname{font-weight:900;letter-spacing:-.5px;line-height:1.1}.brandsub{color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.12em}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:50px;padding:7px 10px;font-size:11px;font-weight:800;letter-spacing:.1em;white-space:nowrap}
    .hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#152744 12%,#294872 90%);border-radius:26px;color:#fff;padding:26px 23px 24px;box-shadow:var(--shadow)}.hero:after{content:"B2";font-weight:900;font-size:clamp(110px,27vw,230px);line-height:1;color:rgba(255,255,255,.06);position:absolute;right:-2%;top:-20px;pointer-events:none}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.16em;color:var(--yellow);text-transform:uppercase}.hero h1{position:relative;z-index:1;font-size:clamp(29px,5.4vw,44px);letter-spacing:-.05em;line-height:1.12;margin:11px 0}.hero p{max-width:410px;font-size:14px;color:#d5e0ed;margin:0 0 21px;position:relative;z-index:1}.hero-actions{display:flex;flex-wrap:wrap;gap:10px;position:relative;z-index:1}.join,.btn{border:0;display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:13px;padding:13px 17px;font-size:14px;font-weight:850;text-decoration:none}.join{background:var(--yellow);color:#182843;box-shadow:0 4px 0 rgba(3,10,22,.15)}.btn-light{background:#ffffff19;color:#fff;border:1px solid #ffffff4a}.join:hover{filter:brightness(1.04)}.tiny-note{font-size:11px;margin-top:12px;color:#cfdae9;position:relative;z-index:1}
    .section-head{margin:30px 0 15px;display:flex;justify-content:space-between;align-items:end;gap:12px}.section-head h2{font-size:21px;letter-spacing:-.04em;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:3px 0 0}.score-chip{border-radius:12px;background:var(--teal-light);color:var(--ok);font-weight:900;padding:7px 12px;font-size:13px;white-space:nowrap}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:var(--shadow)}.module-card{display:block;text-align:left;width:100%;border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px;cursor:pointer;box-shadow:var(--shadow)}.module-top{display:flex;align-items:center;justify-content:space-between;gap:9px}.number{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:var(--navy);color:var(--yellow);font-weight:950;font-size:22px;min-width:58px;height:56px}.small{font-size:11px;color:var(--muted);font-weight:750;letter-spacing:.05em}.module-card h3{margin:12px 0 4px;font-size:18px;line-height:1.25}.module-card p{margin:0;color:var(--muted);font-size:12px}.progress-track{height:8px;border-radius:99px;background:#e6edf4;overflow:hidden;margin-top:18px}.progress-fill{display:block;background:linear-gradient(90deg,var(--teal),#3cc9a6);height:100%;border-radius:inherit;transition:width .3s}.module-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;font-weight:800}.module-bottom span:last-child{color:var(--teal)}.notice{border:1px dashed #bed0df;border-radius:17px;margin-top:14px;background:#f9fbfe;padding:15px 17px;font-size:13px;color:#546782}.notice b{color:var(--navy)}
    .back{border:none;background:none;color:var(--navy);font-weight:800;padding:5px 0;margin-bottom:14px}.unit-hero{background:var(--navy);color:#fff;border-radius:22px;padding:24px}.unit-hero h1{font-size:25px;line-height:1.13;letter-spacing:-.04em;margin:8px 0}.unit-hero p{font-size:13px;color:#cdd9e8;margin:0}.lesson{margin:15px 0}.lesson p{font-size:13px;margin:8px 0}.lesson-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.lesson-mini{border:1px solid #d7e9e2;background:#f3fbf7;border-radius:12px;padding:10px;font-size:12px;color:#3e6270}.lesson-mini strong{display:block;color:var(--ok);margin-bottom:4px}.lesson-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900}.exercise{margin-top:16px}.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:13px;border-bottom:1px solid var(--line);padding-bottom:14px}.ex-head h2{font-size:18px;letter-spacing:-.035em;margin:2px 0}.ex-head p{margin:0;font-size:12px;color:var(--muted)}.excount{background:#edf2f8;color:var(--navy);border-radius:8px;padding:5px 9px;font-weight:850;font-size:12px;white-space:nowrap}.intro{background:#f8f5ea;border-left:3px solid var(--yellow);border-radius:6px;padding:13px;margin:15px 0;font-size:13px}.question{padding:17px 0;border-bottom:1px solid #edf1f6}.question:last-of-type{border-bottom:0}.question-top{display:flex;gap:9px;align-items:start}.qnum{background:#edf2f8;color:#426484;border-radius:7px;font-size:11px;padding:2px 7px;font-weight:900;flex:none}.prompt{white-space:pre-line;font-size:14px;margin:0 0 12px;overflow-wrap:anywhere}.answer-input{width:100%;max-width:540px;padding:12px 13px;color:var(--navy);border-radius:11px;background:#fcfdff;border:1.5px solid #cbd7e3;font-size:14px}.choices{display:grid;grid-template-columns:1fr;gap:7px}.choice{border:1.5px solid #cad6e5;border-radius:10px;padding:11px 13px;text-align:left;color:var(--navy);background:#fff;font-size:13px}.choice.selected{background:#e7f4f1;border-color:var(--teal);font-weight:800}.q-tools{margin-top:9px;display:flex;gap:10px}.micro{border:0;background:none;padding:2px 0;color:#526f89;font-size:12px;font-weight:800;text-decoration:underline;text-underline-offset:3px}.helper{font-size:12px;color:#4b6880;margin:7px 0 0}.feedback{display:none;font-size:12px;line-height:1.5;margin-top:9px;border-radius:9px;padding:10px 12px}.feedback.visible{display:block}.feedback.good{background:var(--teal-light);color:var(--ok)}.feedback.bad{background:var(--bad-light);color:var(--bad)}.check-summary{font-size:13px;margin-top:14px;font-weight:800;color:var(--navy);min-height:20px}.check-summary.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.action-primary{border:0;border-radius:10px;color:#fff;background:var(--navy);padding:11px 15px;font-weight:800;font-size:13px}.action-quiet{border:1px solid #cbd6e2;border-radius:10px;background:#fff;padding:11px 12px;font-size:13px;font-weight:800;color:var(--navy)}.threshold{font-size:12px;color:var(--muted);margin:15px 0 0}
    .field{display:block;font-size:12px;font-weight:850;margin:18px 0 5px}.input-url{display:block;width:100%;border:1.5px solid var(--line);padding:13px;border-radius:11px;color:var(--navy);background:#fff;font-size:14px}.status{min-height:23px;font-size:12px;font-weight:700;margin-top:12px}.setting-copy{font-size:13px;color:var(--muted);margin:8px 0}.setting-note{background:#fff9e9;border-left:3px solid #efb52e;padding:12px;border-radius:7px;font-size:12px;margin-top:18px}.install-list{font-size:13px;line-height:1.7;padding-left:20px}.foot{font-size:12px;color:#7e8ca1;text-align:center;padding:28px 10px 8px}.bottom-nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 8px calc(8px + env(safe-area-inset-bottom));gap:8px}.navbutton{border:0;border-radius:11px;background:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;color:#6e7e94;font-size:11px;font-weight:800;padding:9px 12px;min-width:95px}.navbutton.active{background:#e7f2f0;color:var(--ok)}.navicon{font-size:18px;line-height:1.1}
    @media(min-width:720px){.wrap{padding:26px 30px 0}.hero{padding:38px}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.lesson-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.bottom-nav{position:static;background:transparent;border:0;padding:20px}.foot{margin-bottom:5px}}
    @media(max-width:350px){.wrap{padding:13px 12px 0}.hero{padding:19px}.pill{display:none}.choice{padding:9px}}
  </style>
</head>
